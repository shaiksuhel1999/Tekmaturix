site_name: Tekmaturix
site_description: Ideas, innovations and knowledge, plus a running map of the big problems humanity has not solved yet.
site_url: https://www.tekmaturix.com
repo_url: https://github.com/shaiksuhel1999/Tekmaturix
edit_uri: edit/main/tekmaturix_website/docs/

# Build the finished site into the repo-root /docs folder, which GitHub Pages
# serves directly (Settings > Pages > Branch: main, Folder: /docs).
site_dir: ../docs

theme:
  name: material
  palette:
    # Dark mode by default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/fire
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.tracking
    - navigation.indexes
    - toc.follow

nav:
  - Home: index.md
  - Unsolved:
      - unsolved/index.md
      - Space & Astronomy: unsolved/space.md
      - Oceans: unsolved/oceans.md
      - Artificial Intelligence: unsolved/ai.md
      - The Brain: unsolved/brain.md
      - Medicine: unsolved/medicine.md
      - Earth & Environment: unsolved/earth.md
      - Engineering: unsolved/engineering.md
      - Society & Economics: unsolved/society.md
      - Computing: unsolved/computing.md
      - Future Humanity: unsolved/future-humanity.md
      - Problem Template: unsolved/template.md
  - Innovations:
      - innovations/index.md
      - Real-World Problems: innovations/real-world-problems.md
  - Knowledge:
      - knowledge/index.md
      - Space: knowledge/space.md
      - Oceans & Deep Sea: knowledge/oceans.md
      - Future Technology: knowledge/future-tech.md
      - Mind & Beyond: knowledge/mind.md
      - Maths & Science: knowledge/maths-science.md
      - Philosophy & Philanthropy: knowledge/philosophy.md
      - Ancient Civilizations: knowledge/ancient-civilizations.md
      - Inventions: knowledge/inventions.md
      - Engineering Wonders: knowledge/engineering-wonders.md
      - Natural Wonders: knowledge/natural-wonders.md
      - Medical Science: knowledge/medical-science.md
  - Ideas Notebook: notes/index.md
  - About: about.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/shaiksuhel1999

copyright: Copyright &copy; 2026 Tekmaturix
